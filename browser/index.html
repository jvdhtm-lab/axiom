<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="axiom-api-base" content="/api">
    <title>Axiom browser host</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7fb;
        --surface: #ffffff;
        --text: #111827;
        --muted: #5b6478;
        --border: #d9dfeb;
        --accent: #4f46e5;
        --danger: #b91c1c;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1020;
          --surface: #11182b;
          --text: #e7ecf6;
          --muted: #9aa6c0;
          --border: #24304d;
          --accent: #818cf8;
          --danger: #fca5a5;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        line-height: 1.55;
      }
      .shell { max-width: 820px; margin: 0 auto; padding: 40px 20px; }
      header { margin-bottom: 24px; }
      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 { margin: 0; font-size: 1.7rem; letter-spacing: -0.02em; }
      .lede { margin: 8px 0 0; color: var(--muted); }
      main {
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: 0 18px 50px rgba(17, 24, 39, 0.08);
      }
      .ax-column { display: flex; flex-direction: column; gap: 14px; }
      .ax-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
      h1 { font-size: 1.5rem; }
      p { margin: 0; }
      .ax-metric {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .ax-metric-label { color: var(--muted); }
      .ax-metric-value { font-size: 1.2rem; }
      button {
        align-self: flex-start;
        padding: 10px 16px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.08); }
      button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); }
      .ax-error { color: var(--danger); font-weight: 600; }
      .status {
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .status-error { color: var(--danger); }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <p class="eyebrow">Trusted browser host</p>
        <h1>Axiom <span id="status-app">application</span></h1>
        <p class="lede">
          The host verifies the content hash, ABI, IR, and imports, then renders
          the UiTree returned by Axiom. Application logic stays in <code>.ax</code>.
        </p>
      </header>
      <main id="app" aria-live="polite"></main>
      <p id="status" class="status" role="status">Loading…</p>
    </div>
    <script type="module" src="./host.js"></script>
  </body>
</html>
