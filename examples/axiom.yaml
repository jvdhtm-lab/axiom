# Axiom project configuration (Axiom 1.0 schema).
#
# Environment references use explicit ${...} expansion: ${NAME} is required,
# ${NAME:-default} falls back when the variable is unset or empty. Secrets are
# resolved at runtime and never written into compiled plans, traces, or logs.

version: 1
language: "1.0"

sources:
  - "src/**/*.ax"

integrations:
  claude:
    adapter: anthropic_messages
    base_url: "${ANTHROPIC_BASE_URL:-https://api.anthropic.com}"
    api_key: "${ANTHROPIC_API_KEY}"
    timeout_seconds: 120
    allowed_data_classes: [public, internal]

  deepseek:
    adapter: openai_compatible
    dialect: deepseek
    base_url: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
    api_key: "${DEEPSEEK_API_KEY}"
    timeout_seconds: 120
    allowed_data_classes: [public, internal]

  kimi:
    adapter: openai_compatible
    dialect: moonshot
    base_url: "${KIMI_BASE_URL:-https://api.moonshot.ai/v1}"
    api_key: "${KIMI_API_KEY}"
    timeout_seconds: 120
    allowed_data_classes: [public]

  local:
    adapter: openai_compatible
    base_url: "${AXIOM_LOCAL_BASE_URL:-http://localhost:11434/v1}"
    api_key: "${AXIOM_LOCAL_API_KEY}"
    api_key_optional: true
    timeout_seconds: 180
    allowed_data_classes: [public, internal, pii]

models:
  reasoning:
    integration: claude
    model: "${CLAUDE_MODEL:-claude-model-id}"
    capabilities: [chat, structured_output, tool_calling]

  coding:
    integration: deepseek
    model: "${DEEPSEEK_MODEL:-deepseek-model-id}"
    capabilities: [chat, tool_calling]

  review:
    integration: kimi
    model: "${KIMI_MODEL:-kimi-model-id}"
    capabilities: [chat]

  local_coding:
    integration: local
    model: "${LOCAL_MODEL:-qwen3-coder:30b}"
    capabilities: [chat]

runtime:
  default_model: reasoning
  max_parallel_agents: 4
  max_retries: 3
  request_timeout_seconds: 120
  # Hard ceilings for a single run (agents.md §4). `max_run_cost: null` means
  # "no cost ceiling"; the other budgets always apply.
  max_model_calls: 100
  max_wall_clock_seconds: 1800
  max_agent_attempts: 4
  max_run_cost: null

# Per-API policy. The server enforces these on every call; `requires` lists the
# capability identifiers checked against the compiled plan (agents.md §4).
api_policies:
  get_dashboard:
    version: "1.0.0"
    authentication: required
    requires: ["dashboard:read"]
    data_class: internal
    cache: none

compilation:
  targets: [server, wasm_browser]
  entrypoints:
    server:
      module: src.server
    wasm_browser:
      module: src.frontend
      init: init
      render: render
      handle_event: handle_event
  wasm:
    target: wasm32-unknown-unknown
    host_api_version: 1
    max_module_bytes: 8388608
    reproducible: true

browser:
  isolation: dedicated_worker
  max_memory_pages: 256
  max_compute_ms_per_event: 50
  max_ui_nodes: 10000
  max_event_bytes: 65536
  max_storage_bytes: 1048576
  max_snapshot_bytes: 4194304
  preserve_previous_release_on_failure: true
  state:
    default_scope: per_origin
    default_persistence: memory
  data_cache:
    enabled: true
    max_entries: 128
    max_bytes: 4194304
    default_ttl_seconds: 60
    serve_stale_on_error: true

frontend:
  registry:
    content_addressed: true
    retain_accepted_versions: 5
    require_pinned_references: true
  build_cache:
    enabled: true
    max_bytes: 268435456

filesystem:
  project_root: "."
  default_agent_isolation: per_task
  max_read_bytes: 2000000
  max_write_bytes: 1000000
  max_file_bytes: 2000000
  max_files_per_task: 500
  protect_vcs_metadata: true

databases:
  app:
    engine: sqlite
    path: "var/app.sqlite"
    data_class: internal
    allowed_tables: [teams, tasks, v_team_performance]
    max_rows: 1000
    timeout_seconds: 5
    migrations: "db/migrations"
    destructive_migrations: false
    require_write_approval: true

  reporting:
    engine: postgres
    url: "${AXIOM_REPORTING_DATABASE_URL:-postgres://reporting@db.example.com:5432/reporting?sslmode=verify-full}"
    data_class: confidential
    allowed_tables: [v_team_performance]
    max_rows: 500
    timeout_seconds: 10
    allow_private_network: false

commands:
  cargo_check:
    executable: cargo
    args: ["check", "--offline", "--workspace", "--all-targets"]
    working_directory: "."
    timeout_seconds: 300
    network: false

  unit_tests:
    executable: cargo
    args: ["test", "--offline", "--workspace", "--lib"]
    working_directory: "."
    timeout_seconds: 600
    network: false

  integration_tests:
    executable: cargo
    args: ["test", "--offline", "--workspace", "--test", "*"]
    working_directory: "."
    timeout_seconds: 900
    network: false

  full_ci:
    executable: cargo
    args: ["test", "--offline", "--workspace", "--all-targets"]
    working_directory: "."
    timeout_seconds: 1800
    network: false

  db_tests:
    executable: cargo
    args: ["test", "--offline", "-p", "axiom-database"]
    working_directory: "."
    timeout_seconds: 900
    network: false
