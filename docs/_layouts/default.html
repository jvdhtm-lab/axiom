<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
    <meta name="theme-color" content="#0b1020">
    <link type="application/atom+xml" rel="alternate" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>

    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Axiom home">
          <span class="brand-mark" aria-hidden="true">A</span>
          <span class="brand-text">
            <strong>Axiom</strong>
            <small>language + runtime</small>
          </span>
        </a>

        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label" aria-label="Toggle navigation">
          <span></span><span></span><span></span>
        </label>

        <nav class="site-nav" aria-label="Main navigation">
          <a class="nav-link{% if page.url == '/' %} is-active{% endif %}" href="{{ '/' | relative_url }}">Overview</a>
          <a class="nav-link{% if page.url == '/quickstart.html' %} is-active{% endif %}" href="{{ '/quickstart.html' | relative_url }}">Quickstart</a>
          <a class="nav-link{% if page.url == '/language-tour.html' %} is-active{% endif %}" href="{{ '/language-tour.html' | relative_url }}">Language</a>
          <a class="nav-link{% if page.url == '/examples.html' %} is-active{% endif %}" href="{{ '/examples.html' | relative_url }}">Examples</a>
          <a class="nav-link{% if page.url == '/cli.html' %} is-active{% endif %}" href="{{ '/cli.html' | relative_url }}">CLI</a>
          <a class="nav-link{% if page.url == '/configuration.html' %} is-active{% endif %}" href="{{ '/configuration.html' | relative_url }}">Config</a>
          <a class="nav-link nav-github" href="https://github.com/jvdhtm-lab/axiom">GitHub</a>
        </nav>
      </div>
    </header>

    <main id="content" class="shell site-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <p><strong>Axiom 0.1.0</strong> — development snapshot, not a 1.0 release.</p>
        <p>
          <a href="https://github.com/jvdhtm-lab/axiom">GitHub</a>
          <span aria-hidden="true">·</span>
          <a href="{{ '/release-readiness.html' | relative_url }}">Release readiness</a>
          <span aria-hidden="true">·</span>
          <a href="{{ '/implementation-ledger.html' | relative_url }}">Implementation ledger</a>
          <span aria-hidden="true">·</span>
          <a href="{{ '/github-pages.html' | relative_url }}">Pages guide</a>
        </p>
      </div>
    </footer>
  </body>
</html>
