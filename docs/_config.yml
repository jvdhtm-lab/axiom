title: Axiom
description: A small, strongly typed language and runtime for full-stack applications with AI agents.
url: "https://jvdhtm-lab.github.io"
baseurl: "/axiom"
lang: en

markdown: kramdown

defaults:
  - scope:
      path: ""
    values:
      layout: page

plugins:
  - jekyll-optional-front-matter
  - jekyll-default-layout
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-titles-from-headings
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed

optional_front_matter:
  remove_originals: false

relative_links:
  enabled: true
  collections: true

titles_from_headings:
  enabled: true
  strip_title: true
  collections: true
