version: 1

integrations:
  claude:
    adapter: anthropic_messages
    base_url: "${ANTHROPIC_BASE_URL:-https://api.anthropic.com}"
    api_key: "${ANTHROPIC_API_KEY}"
    timeout_seconds: 90

  local:
    adapter: openai_compatible
    base_url: "${AXIOM_LOCAL_BASE_URL:-http://localhost:11434/v1}"
    api_key: "${AXIOM_LOCAL_API_KEY}"
    api_key_optional: true
    headers:
      x-fixture: "${FIXTURE_HEADER:-none}"

models:
  reasoning:
    integration: claude
    model: "${CLAUDE_MODEL:-claude-model-id}"
    capabilities: [chat, structured_output, tool_calling]
  local_coding:
    integration: local
    model: "${LOCAL_MODEL:-qwen3-coder:30b}"
    capabilities: [chat]

runtime:
  default_model: reasoning
  max_parallel_agents: 4
  max_retries: 2
  request_timeout_seconds: 120

filesystem:
  project_root: "."
  default_agent_isolation: per_task
  max_read_bytes: 2000000
  max_write_bytes: 1000000
  max_files_per_task: 500
  protect_vcs_metadata: true

databases:
  app:
    engine: sqlite
    path: "var/app.sqlite"
    allowed_tables: [teams, tasks]
    max_rows: 100
    timeout_seconds: 5
    migrations: "db/migrations"
    destructive_migrations: false
    require_write_approval: true
  reporting:
    engine: postgres
    url: "${AXIOM_REPORTING_DATABASE_URL:-postgres://reporting@db.example.com/reporting?sslmode=verify-full}"
    data_class: confidential
    allow_private_network: false

frontend:
  registry:
    content_addressed: true
    retain_accepted_versions: 3
  build_cache:
    enabled: true
    max_bytes: 1048576

frontend_state:
  id: dashboard
  type: src.frontend.DashboardState
  schema_version: 3
  scope: application
  persistence: persistent
  migrations:
    - from: 1
      to: 2
      function: src.frontend.migrate_dashboard_v2
    - from: 2
      to: 3
      function: src.frontend.migrate_dashboard_v3

commands:
  cargo_check:
    executable: cargo
    args: ["check", "--offline", "--workspace"]
    working_directory: "."
    timeout_seconds: 300
    network: false
